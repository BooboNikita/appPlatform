    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=app-platform
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=123456
