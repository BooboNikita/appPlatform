  # 绩效评估服务
  perf-service:
    build:
      context: .
      dockerfile: perf-service/Dockerfile
    container_name: app-platform-perf-service
    ports:
      - "8009:8009"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE=app-platform
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=123456
    networks:
      - app-platform-network

networks:
  app-platform-network:
    driver: bridge
    name: app-platform-network
